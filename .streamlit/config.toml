# -----------------------------------------------------------------------------
#  Yev Capital | LoanLogic - Streamlit base theme
# -----------------------------------------------------------------------------
#  WHY THIS FILE EXISTS.
#  The app paints its own UI dark via build_css(), but the INTERNALS of every
#  widget (inputs, selects, dropdowns, the calendar, dataframes) are rendered
#  by Streamlit itself, in Streamlit's base theme. With no base theme pinned
#  that theme came from the OS setting: under a light system theme the widget
#  surfaces stayed white while the app's CSS painted the text near-white, which
#  is what produced the white blocks where text should be.
#
#  Only the five theme options that have existed since Streamlit 0.79 are used
#  here on purpose. Newer keys (borderColor, baseRadius, chartCategoricalColors,
#  the [theme.sidebar] / [theme.light] / [theme.dark] sections, ...) are
#  rejected by older Streamlit releases, and everything they covered is already
#  handled by build_css(), which follows the active theme anyway.
#
#  Palette matches the "dark_navy" preset in THEME_PRESETS.
# -----------------------------------------------------------------------------

[theme]
base                     = "dark"
primaryColor             = "#0EA5E9"
backgroundColor          = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor                = "#E2E8F0"
